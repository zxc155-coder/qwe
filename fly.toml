# Fly.io config for VIBE CLOUD backend (api + bot)
app = "vibe-cloud-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT       = "3001"
  DB_PATH        = "/data/db/vibe_cloud.sqlite"
  RECEIPTS_DIR   = "/data/db/receipts"
  CARD_NUMBER    = "+7 (243) 456-78-78"
  CARD_HOLDER    = "Альфа-Банк (СБП)"
  SUPPORT_USERNAME = "@VibeCloudSupport"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "20s"
    method       = "GET"
    path         = "/api/products"

[[mounts]]
  source      = "vibe_cloud_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus   = 1
